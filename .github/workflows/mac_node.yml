name: Vanta macOS Cloud Node

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  check-account:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub Runner
        run: echo "GitHub Actions is fully active and verified!"

  run-mac:
    strategy:
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Audit & macOS Architecture
        run: |
          uname -m
          sw_vers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt & Launch Vanta Orchestrator
        run: |
          python3 decrypt_and_run.py
