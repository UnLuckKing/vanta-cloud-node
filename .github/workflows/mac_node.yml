name: Vanta macOS Cloud Node

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  run-mac:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: System Audit & Apple Silicon Architecture
        run: |
          uname -m
          sw_vers

      - name: Free Disk Space on macOS
        run: |
          echo "=== DISK BEFORE CLEANUP ==="
          df -h
          rm -rf /Users/runner/Library/Android || true
          rm -rf /Library/Developer/CoreSimulator || true
          rm -rf ~/Library/Caches/* || true
          echo "=== DISK AFTER CLEANUP ==="
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt & Launch Vanta Orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 decrypt_and_run.py
