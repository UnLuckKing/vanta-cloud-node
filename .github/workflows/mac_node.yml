name: Vanta macOS Cloud Node

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-mac:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Audit & macOS Architecture
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sw_vers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt & Launch Vanta Orchestrator
        run: |
          python3 decrypt_and_run.py
