name: Vanta Node Health Watchdog

# Separate workflow on purpose: it has its own concurrency scope, so it can never
# cancel a running node (which is what the old `schedule:` trigger inside
# mac_node.yml did - it killed live customer sessions every 5 hours).
# It only dispatches a fresh node when the published endpoint is provably dead
# and nothing else is already booting.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe published node, restart only if dead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          ep=$(curl -fsS --max-time 20 "https://raw.githubusercontent.com/${REPO}/main/live_endpoint.txt?t=$(date +%s)" 2>/dev/null | head -n1 | tr -d '\r\n ') || ep=""
          echo "published endpoint: '${ep}'"
          alive=0
          if [ -n "$ep" ]; then
            if curl -fsS --max-time 15 "https://${ep}/api/ping" >/dev/null 2>&1; then
              alive=1
            fi
          fi
          echo "api/ping ok: ${alive}"
          runs=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/mac_node.yml/runs?per_page=10")
          booting=$(printf '%s' "$runs" | grep -c '"status": "in_progress"' || true)
          queued=$(printf '%s' "$runs" | grep -c '"status": "queued"' || true)
          echo "booting=${booting} queued=${queued}"
          if [ "${alive}" -eq 0 ] && [ "${booting:-0}" -eq 0 ] && [ "${queued:-0}" -eq 0 ]; then
            echo "node is down and nothing is booting -> dispatching a fresh node"
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/mac_node.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "no action needed"
          fi
